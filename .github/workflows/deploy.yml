name: Deploy zohelo.com

# zohelo.com on Cloudflare Pages (a static site, no Pages Functions). Push to main deploys
# production and keeps zohelo.com and www.zohelo.com pointed at it; a manual run on a branch deploys a preview <branch>.<project>.pages.dev.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # zohelo organisation credentials, mapped to the names the tools read.
      CLOUDFLARE_API_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Cloudflare setup (Pages project; domains and DNS on main)
        run: |
          if [ "$BRANCH" = main ]; then bun scripts/cloudflare-setup.ts --switch-dns; else bun scripts/cloudflare-setup.ts; fi
      - name: Deploy
        # wrangler from the lockfile (devDependency), never a floating bunx download.
        run: |
          set -euo pipefail
          bun run wrangler pages deploy build/client --project-name zohelo --branch "$BRANCH" --commit-dirty=true | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"
          echo "::notice title=deployed::$url"
      - name: Check the site answers
        run: |
          set -euo pipefail
          code=000
          for _ in $(seq 1 24); do  # a new preview hostname gets its certificate within a minute or two
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$DEPLOY_URL/" || true)
            [ "$code" = 200 ] && break
            sleep 10
          done
          if [ "$code" != 200 ] || ! grep -q 'Research' /tmp/page.html; then echo "::error title=site::HTTP $code"; exit 1; fi
          echo "::notice title=site::page 200"
          if [ "$BRANCH" = main ]; then
            live=$(curl -s -o /dev/null -w '%{http_code}' https://zohelo.com/ || true)
            echo "::notice title=zohelo.com::HTTP $live (the certificate can take a few minutes after the first switch)"
          fi
