name: Check

# Pull-request gate for zohelo.com: install from the lockfile, type check (app + functions) and
# build. No credentials; deploys stay in deploy.yml (push to main, manual preview runs).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Actions pinned
        run: scripts/check-pins.sh
      - name: Lint workflows
        run: |
          # shellcheck disable=SC2016 # the -format template is for actionlint, not the shell
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}{{println}}{{end}}'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # update when backlog_sync.py changes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zohelo/zohelo-data
          ref: 7bbed15fdbbcf82f23785ee4b0c322fb14a4c7bf
          sparse-checkout: ops/backlog_sync.py
          path: _zd
          persist-credentials: false
      - name: Linked task
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 _zd/ops/backlog_sync.py pr-check
      - name: Backlog files
        run: pip install pyyaml==6.0.3 && python3 _zd/ops/backlog_sync.py validate --root .
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build
