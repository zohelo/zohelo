# Weekly update PRs for the GitHub Actions (SHA pins) and the bun lockfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:  # majors are upgraded deliberately, not in the weekly group; security updates are unaffected
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
