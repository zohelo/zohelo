  - key: com/site/regions/profiles/sitemap
    type: Task
    title: List the indicator and voivodeship pages in the sitemap
    effort: S
    state: open
    contract: false
    context: 'scripts/sitemap.ts writes build/client/sitemap.xml after the build from `pages` in src/site.config.ts
      only, so the pre-rendered /indicators/<kpi_key> pages (one per published KPI, react-router.config.ts) and the 16
      /regions/<teryt> profiles (VOIVODESHIP_TERYT, src/regions/profile.ts) are missing from it. The sitemap script
      runs with bun after fetch-published, so it can read the catalog; src/site.config.ts must not import
      src/published.ts (node:fs would reach the client bundle).'
    files:
    - edit: scripts/sitemap.ts
    steps:
    - 'Import publishedDir and readCatalog from ''../src/published'' and VOIVODESHIP_TERYT from ''../src/regions/profile''.'
    - 'Build paths: [...pages.map((p) => p.path), ...readCatalog(publishedDir()).kpis.filter((k) => k.status === ''published'').map((k)
      => `/indicators/${k.kpi_key}`), ...VOIVODESHIP_TERYT.map((t) => `/regions/${t}`)].'
    - 'entries = paths.flatMap((path) => …) with the same <url> block as today (loc plus the pl, en and x-default
      alternates), using path instead of page.path. Update the header comment: pages from site.config.ts, every
      published KPI and every voivodeship profile.'
    acceptance:
    - sitemap.xml lists every page of site.config.ts, every published KPI page and the 16 profiles, each in pl and en
      with the hreflang alternates
    verify:
    - run: bun install --frozen-lockfile && bun run lint && bun run build && grep -c '<loc>' build/client/sitemap.xml && grep
        -c '<loc>https://zohelo.com/en/indicators/unemployment_rate/</loc>' build/client/sitemap.xml && grep -c '<loc>https://zohelo.com/regions/12/</loc>'
        build/client/sitemap.xml
      expect: 'the first count is 2 × (pages in site.config.ts + 5 published fixture KPIs + 16), 56 with today''s 7 pages; then
