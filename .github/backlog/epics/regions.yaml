key: com/site/regions
area: com/site
title: Regions (16 voivodeships)
phase: 1
priority: P1
target: 2027-01-16
why: Regional comparisons are what Polish analysts, local press and SMEs search for, and no other source shows GUS
  and Eurostat regional data side by side on one page per region. The dummy Compass map becomes real.
outcome: /regions shows a map and ranking of the 16 voivodeships for a chosen headline KPI, and /regions/<teryt>
  profiles each voivodeship (key KPIs vs Poland, rank, neighbours), pre-rendered in PL and EN.
in_scope:
- Simplified voivodeship geometry from 06_published/v1/geo
- Map + ranking page, 16 profile pages, regional spotlight block on home
out_of_scope:
- Powiat and gmina profiles (Phase 3)
- NUTS regions of other countries
done_when:
- 16 profiles × 2 languages pre-rendered; each shows at least 6 KPIs with national comparison and sources
- CompassSection and its modal are deleted; the home spotlight uses real data
depends_on:
- data/published/published-v1
- com/site/indicators
- com/design/design-v1
deliverables:
- key: com/site/regions/map
  title: Map and ranking
  done_when:
  - /regions renders a choropleth (sequential teal ramp) and a ranking table for a KPI selector
  todo:
  - Route /regions (left out of the build when publishedDir() is null) with a client-only map (Chart + choroplethSpec,
    Task choropleth-spec) and RegionRankingTable (Task region-table); KPI selector limited to KPIs with geography
    level voivodeship.
  tasks:
  - key: com/site/regions/map/ranking
    type: Task
    title: Add the voivodeship ranking function
    effort: S
    state: open
    contract: false
    context: 'The /regions ranking table and the profiles (rank 1–16 and the value for Poland) both need one ranking
      of the 16 voivodeships for a KPI, computed at build from kpi/<kpi_key>/latest.json (zohelo-data docs/published.md:
      one value per source × geography, levels country and voivodeship). This Task adds only the pure function.
      Input is a structural subset of latest.json declared in the file itself, so it does not wait for src/published.ts.'
    files:
    - create: src/regions/ranking.ts
    - create: tests/ranking.test.ts
    steps:
    - 'Export type RegionalLatest = { kpi_key: string; values: { source_key: string; geography_key: string; geography_level:
      string; period: string; value: number; flags: string[] }[] }, type RankedRegion = { geography_key: string;
      value: number; rank: number; provisional: boolean }, type RegionRanking = { kpi_key, source_key, period: string;
      national: number | null; regions: RankedRegion[] }.'
    - 'export function rankRegions(file: RegionalLatest, sourceKey?: string): RegionRanking | null. Rows = values
      with geography_level ''voivodeship''. Source = sourceKey, else the source with the most rows (ties by source_key
      ascending). No row for the source returns null.'
    - Keep the source's rows whose period equals the greatest period among them (string compare).
    - 'Sort by value descending, ties by geography_key ascending. rank = 1 + number of kept rows with a strictly
      greater value (1, 2, 2, 4). provisional = flags includes ''p''.'
    - national = value of the row with geography_key 'PL', the same source and the same period, else null.
    - 'tests/ranking.test.ts (bun:test, inline data): three regions 5, 7, 7 rank 1, 1, 3 in order TERC:02, TERC:12
      (both 7) then the 5; national from the PL row; a region with an older period is left out; the source with
      more rows wins without sourceKey and sourceKey overrides it; flags [''p''] gives provisional true; no voivodeship
      rows give null.'
    acceptance:
    - rankRegions is pure and does not mutate its input
    - Every rule above is covered by a test
    verify:
    - run: bun run lint && bun test tests/ranking.test.ts
      expect: exit 0; 0 fail
    out_of_scope:
    - The map, the KPI selector, the DataTable and routes
    - Sort direction for KPIs where lower is better (the page decides colours)
    depends_on:
    - data/published/published-v1/contract/schemas
  - key: com/site/regions/map/choropleth-spec
    type: Task
    title: Add a choropleth Vega-Lite spec builder to the design package
    effort: S
    state: open
    contract: false
    context: '/regions shows a choropleth of the voivodeships in a teal ramp (Deliverable done_when). Charts are
      Vega-Lite specs from pure functions in packages/design/src/visuals/ (specs.ts, rendered by Chart.tsx); the map
      spec gets its own file so it does not collide with lane-3 Tasks editing specs.ts. Geometry: geo/voivodeship.geojson
      (FeatureCollection; properties.geography_key, name_pl, name_en).'
    files:
    - create: packages/design/src/visuals/map.ts
    - create: packages/design/src/visuals/map.test.ts
    - edit: packages/design/src/visuals/index.ts
    - edit: packages/design/CHANGELOG.md
    steps:
    - 'map.ts (double quotes, like specs.ts): import type { VisualizationSpec } from "vega-embed"; export type ChoroplethOptions
      = { key: string; value: string; valueTitle: string; nameProperty: string; stroke: string; scheme?: string }
      and function choroplethSpec(geo: object, rows: object[], o: ChoroplethOptions): VisualizationSpec.'
    - 'Return { $schema: "https://vega.github.io/schema/vega-lite/v6.json", width: "container", height: 360, autosize:
      { type: "fit", contains: "padding" }, background: "transparent", data: { values: geo, format: { type: "json",
      property: "features" } }, transform: [{ lookup: "properties.geography_key", from: { data: { values: rows },
      key: o.key, fields: [o.value] } }], projection: { type: "mercator" }, mark: { type: "geoshape", stroke: o.stroke,
      strokeWidth: 0.5 }, encoding }.'
    - 'encoding = { color: { field: o.value, type: "quantitative", title: o.valueTitle, scale: { scheme: o.scheme ??
      "teals" }, legend: { orient: "bottom" } }, tooltip: [{ field: `properties.${o.nameProperty}`, type: "nominal",
      title: "Region" }, { field: o.value, type: "quantitative", title: o.valueTitle, format: ",.4~f" }] }.'
    - 'index.ts: add export { choroplethSpec, type ChoroplethOptions } from "./map";. CHANGELOG.md: add `choroplethSpec`
      to the `./visuals` line under 1.0.0.'
    - 'map.test.ts (bun:test, inline FeatureCollection of TERC:12 and TERC:30): data.values is geo, data.format.property
      ''features''; lookup uses o.key and [o.value]; scheme ''teals'' by default, else the given one; first tooltip
      field ''properties.name_pl'' for nameProperty ''name_pl''; inputs not mutated.'
    acceptance:
    - choroplethSpec is pure and every rule above is tested
    verify:
    - run: bun run lint && bun test packages/design/src/visuals/map.test.ts
      expect: exit 0; 0 fail
    out_of_scope:
    - A map component, the KPI selector, the /regions route; tokens, specs.ts, Chart.tsx
    depends_on:
    - com/design/design-v1/visuals/move
  - key: com/site/regions/map/region-table
    type: Task
    title: Add readGeo and the voivodeship ranking table
    effort: M
    state: open
    contract: false
    context: 'rankRegions() in src/regions/ranking.ts ranks voivodeships by geography_key, but the page shows names.
      Names are in geo/voivodeship.geojson (properties geography_key, name_pl, name_en, level, parent_key; zohelo-data
      docs/published.md), which src/published.ts cannot read yet. This Task adds the reader, a pure row builder and
      a table on DataTable from @zohelo/design.'
    files:
    - edit: src/published.ts
    - create: src/regions/table.ts
    - create: src/components/RegionRankingTable.tsx
    - create: tests/regionTable.test.tsx
    steps:
    - 'src/published.ts: export types GeoFeature = { type: ''Feature''; properties: { geography_key: string; name_pl:
      string; name_en: string; level: string; parent_key?: string }; geometry: unknown } and GeoCollection = { type:
      ''FeatureCollection''; features: GeoFeature[] }; export function readGeo(dir: string, level: string): GeoCollection
      reading geo/<level>.geojson with readJson; throw invalid(path) unless type is ''FeatureCollection'' and features
      an array.'
    - 'src/regions/table.ts: export type RegionRow = { rank: number; name: string; value: number; provisional: boolean
      } and function regionRows(ranking: RegionRanking, geo: GeoCollection, locale: ''pl'' | ''en''): RegionRow[] in
      ranking.regions order; name = the feature''s name_pl/name_en for the geography_key, else the geography_key.'
    - 'src/components/RegionRankingTable.tsx: RegionRankingTable({ rows, locale, caption, unit }) renders DataTable
      (not sortable) with columns rank (''Miejsce''/''Rank'', right), name (''Województwo''/''Voivodeship''), value
      (`Wartość (${unit})`/`Value (${unit})`, right, format: (v) => formatNumber(v as number, locale)) and provisional
      (''Status''; ''wstępne''/''provisional'' when true, else empty).'
    - 'tests/regionTable.test.tsx (bun:test): readGeo(''fixtures/published'', ''voivodeship'') has 1 feature named
      ''Małopolskie''; level ''gmina'' throws /published file missing/; regionRows for TERC:12 (rank 1) and TERC:30
      (rank 2) gives ''Małopolskie'' (pl), ''Lesser Poland'' (en) and ''TERC:30''; renderToStaticMarkup shows ''Województwo''
      and ''2,6'' in pl and ''provisional'' in en.'
    acceptance:
    - Existing readers and tests are unchanged and pass
    - Every rule above is covered by a test
    verify:
    - run: bun run lint && bun test
      expect: exit 0; 0 fail
    out_of_scope:
    - The map, the KPI selector and the /regions route
    - Changing rankRegions()
    depends_on:
    - com/site/regions/map/ranking
    - com/site/indicators/data/readers
    - com/design/design-v1/components/table
- key: com/site/regions/profiles
  title: Voivodeship profiles
  depends_on:
  - com/site/regions/map
  done_when:
  - /regions/<teryt> for all 16 TERYT codes with KPIs vs Poland and rank
  todo:
  - Route /regions/:teryt; KpiTile grid with national value and rank 1–16; neighbours list from geometry adjacency
    computed at build.
- key: com/site/regions/home
  title: Regional spotlight on home
  depends_on:
  - com/site/regions/profiles
  done_when:
  - Home spotlight shows one KPI map and top/bottom 3; CompassSection, DataVisualizationModal and polandRegions.ts/financeTrends.ts
    deleted
  todo:
  - Replace CompassSection with the spotlight block; delete the sample files.
