key: com/growth/chart-of-day
area: com/growth
title: Chart of the day (rule-based)
phase: 1
priority: P2
target: 2027-01-23
why: Daily habit needs one new, finishable thing each weekday. A chart of the largest mover among the catalogued
  KPIs, with a templated headline, delivers that without AI or an editor.
outcome: Every weekday the home page shows one chart of the KPI that moved most since its previous value, with a
  templated takeaway headline, source footer and link to its indicator page.
in_scope:
- Selection rule (largest absolute relative change of the latest value among published KPIs)
- Templated PL/EN headline, chart from @zohelo/design visuals
out_of_scope:
- An archive of past charts (decided 27 Oct by the architect; revisit with the newsletter, Phase 2)
- AI-written text (Phase 2, budget-gated)
- Social posting
done_when:
- After each publish the home chart shows the KPI chosen by the rule, with its headline and source
depends_on:
- data/published/published-v1
- com/design/design-v1
- com/site/indicators
decisions:
- 'architect 28 Oct: v1 ranks KPIs by the relative change between value and previous_value of kpi/<key>/latest.json
  (country PL, non-provisional); a z-score needs series.parquet history and is revisited after the indicator pages'
deliverables:
- key: com/growth/chart-of-day/rule
  title: Selection rule and headline template
  done_when:
  - A pure function picks the KPI and renders the headline; unit-tested on fixtures
  tasks:
  - key: com/growth/chart-of-day/rule/select
    type: Task
    title: Add the chart-of-the-day selection rule and headlines
    effort: M
    state: open
    contract: false
    context: 'Pure function only (the home block is a later Task), using the rule decided in this Epic. Its input
      type is a structural subset of kpi/<kpi_key>/latest.json (zohelo-data docs/published.md) declared in the
      file, so it does not wait for src/published.ts.'
    files:
    - create: src/growth/chartOfDay.ts
    - create: tests/chartOfDay.test.ts
    steps:
    - 'Export types: LatestFile = { kpi_key: string; values: { source_key: string; geography_key: string; period:
      string; value: number; previous_value?: number; flags: string[] }[] }; KpiNames
      = Record<string, { name_pl: string; name_en: string }>; ChartOfDay = { kpi_key, source_key, period, headline_pl,
      headline_en: string; change_pct: number }.'
    - 'export function chartOfDay(files: LatestFile[], names: KpiNames): ChartOfDay | null. Per file keep rows
      with geography_key ''PL'', previous_value defined and not 0, and flags without ''p''; skip the file when
      names has no entry or no row is left. Take the row with the greatest period (string compare), ties by
      source_key ascending.'
    - 'change_pct = (value - previous_value) / Math.abs(previous_value) * 100. Winner: greatest Math.abs(change_pct),
      ties by kpi_key ascending. No candidate returns null.'
    - 'Headlines with formatNumber(x, locale) from @zohelo/design: up → `${name_pl}: wzrost
      z ${prev} do ${val} (${period})` and `${name_en}: up from ${prev} to ${val} (${period})`; down → ''spadek
      z … do …'' and ''down from … to …''; change_pct 0 → `${name_pl}: bez zmian, ${val} (${period})` and `${name_en}:
      unchanged at ${val} (${period})`.'
    - 'tests/chartOfDay.test.ts (bun:test, inline data): unemployment_rate PL eurostat 2025 3.2 prev 2.9 vs inflation
      2026-09 2.8 prev 2.9 picks unemployment_rate with headline_pl ''Stopa bezrobocia (BAEL): wzrost z 2,9 do
      3,2 (2025)'' and headline_en ''Unemployment rate (LFS): up from 2.9 to 3.2 (2025)''; inflation alone gives
      ''Inflacja (ceny konsumpcyjne): spadek z 2,9 do 2,8 (2026-09)''; flags [''p''] on unemployment picks inflation;
      two KPIs with equal change pick the lower kpi_key; value equal to previous_value gives ''Stopa bezrobocia (BAEL): bez zmian, 3,2 (2025)''; a 2024 world_bank_wdi row loses to the 2025 eurostat row;
      only TERC:12 rows or previous_value 0 give null.'
    acceptance:
    - chartOfDay is pure; every rule above has a test
    verify:
    - run: bun run lint && bun test tests/chartOfDay.test.ts
      expect: exit 0; 0 fail
    out_of_scope:
    - The home block, file reading, units in headlines
    depends_on:
    - data/published/published-v1/contract/schemas
- key: com/growth/chart-of-day/page
  title: Home block
  depends_on:
  - com/growth/chart-of-day/rule
  done_when:
  - Home shows today's chart with headline, Chart, SourceFooter and a link to /indicators/<kpi_key>
  todo:
  - Give the home ChartOfDayBlock a line Chart child from a .client module rendered after hydration (decision D25)
    once kpi/<kpi_key>/series.parquet has a reader at build.
  tasks:
  - key: com/growth/chart-of-day/page/block
    type: Task
    title: Add the chart-of-the-day home block component
    effort: S
    state: open
    contract: false
    context: 'chartOfDay() (src/growth/chartOfDay.ts) picks the KPI with the largest change and returns { kpi_key,
      source_key, period, headline_pl, headline_en, change_pct }. The home block shows it with a chart, the source
      line and a link to the indicator page. Charts may only render after hydration from a .client module (decision
      D25) and series data has no reader yet, so the block takes the chart as children. Card, SourceFooter and formatDelta
      come from @zohelo/design.'
    files:
    - create: src/growth/ChartOfDayBlock.tsx
    - create: tests/chartOfDayBlock.test.tsx
    steps:
    - 'export function ChartOfDayBlock({ pick, sourceName, date, locale, children }: { pick: ChartOfDay; sourceName:
      string; date: string; locale: Locale; children?: ReactNode }) (ChartOfDay type from ''./chartOfDay'', Locale
      and localizedPath from ''../i18n'').'
    - 'Render <Card title={locale === ''pl'' ? ''Wykres dnia'' : ''Chart of the day''}> containing: <p className="font-display
      text-[length:var(--z-size-xl)] text-text"> with headline_pl / headline_en; <p className="z-figures mt-1 text-text-muted">
      with `${d.text} %` where d = formatDelta(pick.change_pct, locale, { decimals: 1 }); children inside <div className="mt-4">
      when given; <SourceFooter sources={[{ name: sourceName }]} date={date} locale={locale} />; <a href={localizedPath(`/indicators/${pick.kpi_key}`,
      locale)} className="mt-3 inline-block font-ui text-brand-teal underline"> ''Zobacz wskaźnik'' / ''See the indicator''.'
    - 'tests/chartOfDayBlock.test.tsx (bun:test, renderToStaticMarkup; pick = chartOfDay([readKpiLatest(''fixtures/published'',
      ''unemployment_rate'')], names from readCatalog(''fixtures/published'').kpis)!; sourceName ''Eurostat'', date
      ''2026-01-01''): pl markup contains ''Wykres dnia'', ''Stopa bezrobocia (BAEL): wzrost z 2,9 do 3,2 (2025)'',
      ''+10,3 %'' and href="/indicators/unemployment_rate", and its text without tags (replace(/<[^>]+>/g, '''')) contains
      ''Źródło: Eurostat, dane z 2026-01-01''; en contains ''Chart of the day'',
      ''Unemployment rate (LFS): up from 2.9 to 3.2 (2025)'', ''+10.3 %'' and href="/en/indicators/unemployment_rate";
      a child <span>chart</span> is rendered.'
    acceptance:
    - Every rule above is covered by a test
    verify:
    - run: bun run lint && bun test tests/chartOfDayBlock.test.tsx
      expect: exit 0; 0 fail
    out_of_scope:
    - Placing the block on home, the chart itself and reading series.parquet
    - Changing chartOfDay()
    depends_on:
    - com/growth/chart-of-day/rule/select
    - com/design/design-v1/components/basics
    - com/design/design-v1/components/table
  - key: com/growth/chart-of-day/page/home-block
    type: Task
    title: Show the chart of the day on the home page
    effort: S
    state: open
    contract: false
    context: 'chartOfDay() (src/growth/chartOfDay.ts) picks the national KPI with the largest relative change from the
      latest.json files; ChartOfDayBlock (src/growth/ChartOfDayBlock.tsx) renders it with headline, change, SourceFooter
      and a link to the indicator page. Neither is on the home page yet. The home loader (src/routes/home.tsx) already
      reads the catalog and latest.json files at build (ssr false) and passes its data to App (src/App.tsx). The
      chart child comes later (todo).'
    files:
    - edit: src/routes/home.tsx
    - edit: src/App.tsx
    - create: tests/homeChartOfDay.test.ts
    steps:
    - 'home.tsx: export type HomeChartOfDay = { pick: ChartOfDay; sourceName: string; date: string } and function homeChartOfDay(dir:
      string, catalog: Catalog, locale: Locale): HomeChartOfDay | null. files = requiredLatest(catalog).map((k) => readKpiLatest(dir,
      k)); names = Object.fromEntries(catalog.kpis.map((k) => [k.kpi_key, { name_pl: k.name_pl, name_en: k.name_en }]));
      pick = chartOfDay(files, names); null when pick is null. sourceName = name_pl/name_en of the catalog source with
      pick.source_key, else pick.source_key; date = generated_at.slice(0, 10) of the file whose kpi_key is pick.kpi_key.'
    - 'The loader returns chartOfDay: homeChartOfDay(dir, catalog, locale) and Home passes it to App.'
    - 'App.tsx: new prop chartOfDay: HomeChartOfDay | null (import type from ''./routes/home''). Right after <HomeSpotlight
      …/> render, when not null, <section aria-label={locale === ''pl'' ? ''Wykres dnia'' : ''Chart of the day''} className="mx-auto
      max-w-6xl px-4 py-8"><ChartOfDayBlock pick={…} sourceName={…} date={…} locale={locale} /></section>, with no
      children.'
    - 'tests/homeChartOfDay.test.ts (bun:test, dir ''fixtures/published''): the pl result has pick.kpi_key equal to
      chartOfDay() over the same files, a non-empty sourceName and a date matching /^\d{4}-\d{2}-\d{2}$/; the en sourceName
      is the source''s name_en; a catalog copy with kpis [] gives null.'
    acceptance:
    - build/client/index.html contains 'Wykres dnia' and build/client/en/index.html 'Chart of the day'
    verify:
    - run: bun install --frozen-lockfile && bun run lint && bun test tests/homeChartOfDay.test.ts && bun run build && grep -c 'Wykres
        dnia' build/client/index.html
      expect: exit 0; 0 fail; grep prints at least 1
    out_of_scope:
    - The line chart child and a series.parquet reader (todo)
    - Changing chartOfDay() or ChartOfDayBlock
    - Removing PulseSection or any other legacy section
    depends_on:
    - com/growth/chart-of-day/page/block
