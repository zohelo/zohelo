- key: com/design/design-v1/release
  title: Versioned release
  depends_on:
  - com/design/design-v1/components
  - com/design/design-v1/visuals
  - com/design/design-v1/logo
  done_when:
  - Release design-v1.0.0 with asset zohelo-design-1.0.0.tgz downloadable without auth
  tasks:
  - key: com/design/design-v1/release/workflow
    type: Task
    title: Add the design-release workflow
    effort: M
    state: open
    contract: true
    context: 'D3: @zohelo/design ships as a tarball on a GitHub Release of zohelo/zohelo; consumers depend on https://github.com/zohelo/zohelo/releases/download/design-vX.Y.Z/zohelo-design-X.Y.Z.tgz.
      A manual workflow cuts releases so nobody pushes tags by hand.'
    files:
    - create: .github/workflows/design-release.yml
    - create: packages/design/CHANGELOG.md
    - edit: .github/workflows/check.yml
    steps:
    - 'design-release.yml: on workflow_dispatch with input version (string, e.g. 1.0.0); permissions contents: write;
      one job, timeout 10 min.'
    - 'First step (fails, not skips): if [ "$GITHUB_REF" != refs/heads/main ]; then echo ''::error::run on main'';
      exit 1; fi.'
    - 'Then (SHA-pinned like check.yml): checkout, setup-bun 1.4.2, bun install --frozen-lockfile; fail with ::error
      unless jq -r .version packages/design/package.json equals the input; cd packages/design && bun run build &&
      bun pm pack (writes zohelo-design-<version>.tgz).'
    - 'gh release create design-v<version> packages/design/zohelo-design-<version>.tgz --title ''design v<version>''
      --notes-file packages/design/CHANGELOG.md --target main (env GH_TOKEN: github.token).'
    - 'check.yml: add a step ''Lint workflows'': bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
      1.7.7 && ./actionlint -color.'
    - CHANGELOG.md starts with '## 1.0.0' and the list of exports.
    acceptance:
    - actionlint passes in check on this PR
    - After merge, a run on main with a version different from package.json fails at the version step
    verify:
    - workflow: Check on this PR
      expect: green, step Lint workflows ran
    - workflow: design-release on main with version 9.9.9 (after merge)
      expect: fails with the version mismatch error; no release created
    out_of_scope:
    - Publishing to any npm registry
  - key: com/design/design-v1/release/v1
    type: Task
    title: Cut design-v1.0.0
    effort: S
    state: open
    verify_only: true
    depends_on:
    - com/design/design-v1/release/workflow
    context: All v1 Deliverables merged; this Task only runs the release and checks it.
    files: []
    steps:
    - Run design-release on main with version 1.0.0.
    - Check the asset URL answers 200.
    acceptance:
    - https://github.com/zohelo/zohelo/releases/download/design-v1.0.0/zohelo-design-1.0.0.tgz downloads
    verify:
    - run: curl -sIL -o /dev/null -w '%{http_code}' https://github.com/zohelo/zohelo/releases/download/design-v1.0.0/zohelo-design-1.0.0.tgz
      expect: '200'
    out_of_scope:
    - Adoption in other repos
