key: com/site/indicators
area: com/site
title: Indicators (20 headline KPIs)
phase: 1
priority: P1
target: 2027-01-09
why: 'Indicator pages are the search engine of the site: one address per KPI ("stopa bezrobocia Polska") with the
  latest value, a chart, regions and sources. They replace the dummy metric cards and the Pulse ticker with real,
  cited numbers.'
outcome: /indicators lists 20 headline KPIs by domain and /indicators/<kpi_key> shows each with latest value, change,
  chart, regional breakdown where available, definition, sources, licence and download, in PL and EN, pre-rendered
  from the published layer.
in_scope:
- Build-time data from 06_published/v1 (catalog, kpi/<key>/latest.json and series.parquet)
- Index page, KPI page template, Dataset JSON-LD, today strip on home (6 KPI chips)
- Replacing MetricsSection and PulseSection with real KPIs (markets = NBP/ECB rates, decision 3)
out_of_scope:
- All catalogued KPIs (Phase 3 growth; the template handles them automatically)
- Interactive pivot (zohelo-bi)
done_when:
- 20 KPI pages × 2 languages pre-rendered; every number shows source, dataset code and date
- The home today strip shows CPI, unemployment, GDP growth, EUR/PLN, average wage, NBP reference rate with real
  values
- No Illustrative badge remains on the metrics or pulse sections
depends_on:
- data/published/published-v1
- data/metadata/catalogue-v1
- com/site/site-v1
- com/design/design-v1
decisions:
- 'owner 27 Oct no. 3: markets section uses public rates (NBP/ECB), no stock quotes'
- 'plan §3.5: zohelo.com never calls the lakehouse at runtime; it fetches published files at build'
deliverables:
- key: com/site/indicators/data
  title: Published data available at build
  done_when:
  - Build fails clearly when published files are missing; local dev works from a committed fixture
  notes:
  - 'scripts/fetch-published.ts and the deploy env are Tasks com/growth/what-changed/build-data/fetch-script and deploy-env
    (shared); the PR check keeps reading fixtures/published/ (no credentials).'
  tasks:
  - key: com/site/indicators/data/readers
    type: Task
    title: Add published-layer fixtures and typed readers
    effort: M
    state: open
    contract: false
    context: 'The site reads 06_published/v1 files at build, never at runtime (contract: zohelo-data docs/published.md
      and warehouse/published/). Nothing is in R2 yet, so the site works from copies of the contract fixtures.
      Readers take the directory as an argument: the build later passes .published/, tests pass fixtures/published.'
    files:
    - create: fixtures/published/
    - create: src/published.ts
    - create: tests/published.test.ts
    steps:
    - 'Copy the five fixtures: `for p in catalog/catalog.json manifest.json kpi/unemployment_rate/latest.json
      feed/changes.json geo/voivodeship.geojson; do mkdir -p fixtures/published/$(dirname $p); gh api "repos/zohelo/zohelo-data/contents/warehouse/published/fixtures/$p?ref=47bb8da1997995cfedd4b69ac6b7ccafc8a468b7"
      -H "Accept: application/vnd.github.raw" > fixtures/published/$p; done`.'
    - 'src/published.ts: export types with every field of docs/published.md (optional fields with ?): Catalog
      (version: 1, generated_at, kpis: CatalogKpi[], domains: Domain[], units: Unit[], sources: Source[], licences:
      Licence[]), CatalogKpi (dimensions: KpiDimension[]), Domain {domain_key, level, parent_key: string | null,
      name_en, name_pl, csa_code, sort: number}, Unit {unit_key, symbol, name_en, name_pl, is_rate: boolean},
      KpiLatest, LatestValue, Changes, ChangeItem.'
    - 'Readers (node:fs readFileSync, node:path join): readCatalog(dir) → catalog/catalog.json, readKpiLatest(dir,
      kpiKey) → kpi/<kpiKey>/latest.json, readChanges(dir) → feed/changes.json.'
    - 'One private readJson(path): a missing file throws Error(`published file missing: ${path}`). Each reader then
      throws Error(`published file invalid: ${path}`) unless: catalog version === 1 and kpis is an array; latest
      kpi_key === kpiKey and values is an array; changes items is an array.'
    - 'tests/published.test.ts (bun:test, dir ''fixtures/published''): catalog has 5 kpis and unemployment_rate
      name_pl ''Stopa bezrobocia (BAEL)''; latest values[0].value is 3.2; changes has 2 items; readKpiLatest(dir,
      ''nope'') and readCatalog(''fixtures'') throw /published file missing/.'
    acceptance:
    - The five fixtures are identical to zohelo-data's at the pinned commit
    - Reader errors name the file path
    verify:
    - run: bun run lint && bun test tests/published.test.ts
      expect: exit 0; 0 fail
    - run: bun run build
      expect: exit 0
    out_of_scope:
    - scripts/fetch-published.ts and deploy.yml (todo above)
    - Readers for manifest.json, series.parquet and geo files
    depends_on:
    - data/published/published-v1/contract/schemas
  - key: com/site/indicators/data/fixtures-sync-kpis-40
    type: Task
    title: Sync the published fixtures with zohelo-data (two GDP KPIs)
    effort: M
    state: open
    contract: true
    context: 'zohelo-data publishes eight more KPIs in pairs (Epic data/published/kpis-40). Each publish Task adds
      its warehouse/published/fixtures/kpi/<key>/latest.json and catalog entries on the producer side (D26). The
      site''s copy is behind: gdp_per_capita and gdp_volume_growth are missing; catalog.json, manifest.json and
      kpi/unemployment_rate/latest.json differ. Review of zohelo-data#2505: readers follow before the next
      publish Task merges. Values are synthetic (FIXTURE.txt).'
    files:
    - edit: fixtures/published/
    - edit: tests/
    steps:
    - 'Copy the producer files byte for byte, keeping FIXTURE.txt and kpi/fx_rate/ as they are: `for p in catalog/catalog.json
      manifest.json status.json feed/changes.json geo/voivodeship.geojson kpi/gdp_current_prices/latest.json kpi/gdp_per_capita/latest.json
      kpi/gdp_volume_growth/latest.json kpi/inflation/latest.json kpi/population/latest.json kpi/unemployment_rate/latest.json;
      do mkdir -p fixtures/published/$(dirname $p); gh api "repos/zohelo/zohelo-data/contents/warehouse/published/fixtures/$p?ref=a3b7f86f3656ce48b5eb5d4bd2d2289da3ed6471"
      -H "Accept: application/vnd.github.raw" > fixtures/published/$p; done`.'
    - 'Run `bun test`. Fix only the expectations that changed because of the new fixture content (KPI counts in the
      catalog, the unemployment_rate voivodeship rows, lists of KPI keys). Keep the intent of each test, and list
      every changed expectation with its old and new value in the PR body.'
    - 'If a reader mirrors the producer''s skip list (NO_LATEST, D26), check it still equals zohelo-data
      warehouse/publish.py SKIP (today only fx_rate). Leave the code unchanged if it does.'
    - 'The build must show the two new KPIs wherever the site lists all catalog KPIs (e.g. /indicators); name the
      routes in the PR body.'
    acceptance:
    - The 11 files equal zohelo-data's at commit a3b7f86 (`cmp` in the PR body)
    - bun test passes, with every changed expectation listed in the PR body
    - No source file outside tests/ changes, unless a reader fails on the new KPIs. Then stop and comment on this issue
    verify:
    - run: bun install --frozen-lockfile && bun run lint && bun test && bun run build
      expect: exit 0; 0 fail
    out_of_scope:
    - Pages for the new KPIs (the template handles them; page work is in com/site/indicators/pages)
    - Changing zohelo-data fixtures (comment on zohelo-data instead)
    - The six KPIs not published yet; each later publish gets its own sync Task
    depends_on:
    - com/site/indicators/data/readers
- key: com/site/indicators/pages
  title: Index and KPI page template
  depends_on:
  - com/site/indicators/data
  done_when:
  - /indicators and /indicators/<kpi_key> pre-rendered for the 20 KPIs listed in site.config
  todo:
  - 'On /indicators/:kpi: line Chart from readKpiSeries() (Task series-reader) once the Designer''s chart style exists
    (O17), definition (catalog.json has no definition field yet).'
  tasks:
  - key: com/site/indicators/pages/groups
    type: Task
    title: Group catalog KPIs by domain for the indicators index
    effort: S
    state: open
    contract: false
    context: 'The /indicators page will list KPIs grouped by their top-level domain. src/published.ts already reads
      catalog/catalog.json (types Catalog, CatalogKpi, Domain, Unit); fixtures/published/catalog/catalog.json has
      5 KPIs in 4 domains. This Task adds only the pure grouping function; the route comes later.'
    files:
    - create: src/indicators/groups.ts
    - create: tests/indicatorGroups.test.ts
    steps:
    - 'src/indicators/groups.ts: export type IndicatorLink = { kpi_key: string; name: string; unit: string; last_period:
      string; href: string } and IndicatorGroup = { domain_key: string; name: string; kpis: IndicatorLink[] }.'
    - 'export function indicatorGroups(catalog: Catalog, locale: Locale): IndicatorGroup[] (`import type { Catalog } from ''../published''`,
      Locale and localizedPath from ''../i18n''). Keep KPIs with status ''published''. Group key = kpi.domain_path[0];
      the group is the catalog.domains entry with that domain_key and level ''domain''; KPIs without one are left out.'
    - 'name = name_pl or name_en by locale (KPI and domain); unit = symbol of the catalog.units entry with the KPI''s
      unit_key, else the unit_key; href = localizedPath(`/indicators/${kpi_key}`, locale).'
    - 'Order groups by domain sort ascending, ties by domain_key; KPIs inside a group by name with localeCompare(other,
      locale). Groups with no KPIs are not returned. Do not mutate the catalog.'
    - 'tests/indicatorGroups.test.ts (bun:test, readCatalog(''fixtures/published'')): pl group keys are [''economy'',
      ''finance'', ''labour'', ''population'']; economy KPI names are [''Inflacja (ceny konsumpcyjne)'', ''PKB w cenach
      bieżących'']; en economy names are [''GDP, current prices'', ''Inflation, consumer prices'']; en fx_rate href
      is ''/en/indicators/fx_rate'' and pl is ''/indicators/fx_rate''; unemployment_rate unit is ''%''; in a structuredClone
      with fx_rate status ''draft'' the finance group is gone; a KPI whose domain_path[0] is ''nope'' is left out.'
    acceptance:
    - indicatorGroups is pure and every rule above is covered by a test
    verify:
    - run: bun run lint && bun test tests/indicatorGroups.test.ts
      expect: exit 0; 0 fail
    out_of_scope:
    - The /indicators route, KpiTile values and site.config entries
    - Groups below the domain level
    depends_on:
    - com/site/indicators/data/readers
  - key: com/site/indicators/pages/latest-tile
    type: Task
    title: Derive KpiTile values from a KPI's latest.json
    effort: S
    state: open
    contract: false
    context: 'Indicator pages and the home today strip show each KPI as a KpiTile from @zohelo/design (props label,
      value, unit, delta, period). The national value comes from kpi/<kpi_key>/latest.json (reader readKpiLatest
      in src/published.ts), which holds one row per source × geography. This Task adds the pure function that picks
      the row and builds the props.'
    files:
    - create: src/indicators/tile.ts
    - create: tests/indicatorTile.test.ts
    steps:
    - 'src/indicators/tile.ts: export type LatestTile = { label: string; value: number | null; unit: string; delta:
      number | null; period: string; sourceKey: string | null; checkedAt: string | null; provisional: boolean }.'
    - 'export function latestTile(kpi: CatalogKpi, latest: KpiLatest, units: Unit[], locale: Locale): LatestTile
      (`import type` from ''../published'', Locale from ''../i18n''). Rows = latest.values with geography_key ''PL''. Source
      = the first of kpi.source_keys that has a row, else the smallest source_key among the rows. Row = that source''s
      row with the greatest period (string compare).'
    - 'label = kpi.name_pl or name_en; unit = symbol of the units entry with kpi.unit_key, else kpi.unit_key; value,
      period, sourceKey = source_key, checkedAt = checked_at from the row; delta = value - previous_value when previous_value
      is present, else null; provisional = flags includes ''p''.'
    - 'No PL row: value null, delta null, period kpi.last_period, sourceKey null, checkedAt null, provisional false.'
    - 'tests/indicatorTile.test.ts (bun:test): from fixtures/published (readCatalog, readKpiLatest ''unemployment_rate'')
      pl gives label ''Stopa bezrobocia (BAEL)'', value 3.2, unit ''%'', delta toBeCloseTo(0.3), period ''2025'',
      sourceKey ''eurostat'', checkedAt ''2026-01-01T00:00:00Z''; en label ''Unemployment rate (LFS)''. Inline data:
      world_bank_wdi and eurostat PL rows pick eurostat (first in source_keys); 2024 and 2025 rows pick 2025; no previous_value
      gives delta null; flags [''p''] gives provisional true; no PL row gives value null and period kpi.last_period.'
    acceptance:
    - latestTile is pure and every rule above is covered by a test
    verify:
    - run: bun run lint && bun test tests/indicatorTile.test.ts
      expect: exit 0; 0 fail
    out_of_scope:
    - Rendering KpiTile on a page; goodDirection per KPI
    - Regional rows (src/regions/ranking.ts covers them)
    depends_on:
    - com/site/indicators/data/readers
  - key: com/site/indicators/pages/dataset-jsonld
    type: Task
    title: Build Dataset JSON-LD for indicator pages
    effort: S
    state: open
    contract: false
    context: 'Each /indicators/<kpi_key> page will carry schema.org Dataset JSON-LD so search engines list it as
      a dataset. src/seo.ts has absoluteUrl() and pageMeta(); src/published.ts has the Catalog types. This Task
      adds the pure builder; the route embeds it later the way src/routes/home.tsx embeds its WebSite JSON-LD.'
    files:
    - edit: src/seo.ts
    - create: tests/datasetJsonLd.test.ts
    steps:
    - 'src/seo.ts: export function datasetJsonLd(kpi: CatalogKpi, catalog: Catalog, locale: Locale): Record<string,
      unknown> (`import type { Catalog, CatalogKpi } from ''./published''`: seo.ts is in the client bundle and published.ts
      imports node:fs). Sources = catalog.sources whose source_key is in kpi.source_keys, in
      kpi.source_keys order; unknown keys are skipped. unit = catalog.units entry with kpi.unit_key.'
    - 'Return { ''@context'': ''https://schema.org'', ''@type'': ''Dataset'', name, description, url: absoluteUrl(`/indicators/${kpi.kpi_key}`,
      locale), identifier: kpi.kpi_key, inLanguage: locale, temporalCoverage: `${first_period}/${last_period}`,
      dateModified: kpi.loaded_at, spatialCoverage: { ''@type'': ''Place'', name: ''Polska'' | ''Poland'' }, creator:
      { ''@type'': ''Organization'', name: site.name, url: site.url }, isBasedOn: sources.map(s => ({ ''@type'':
      ''CreativeWork'', name: s.name_pl | s.name_en })) }.'
    - 'description pl: `${name_pl}: dane od ${first_period} do ${last_period}. Źródła: ${names joined '', ''}. Jednostka:
      ${unit.name_pl}.`; en: `${name_en}: data from ${first_period} to ${last_period}. Sources: ${names}. Unit: ${unit.name_en}.`'
    - 'Add license: <licence url> only when all sources have the same licence_key and catalog.licences has it.'
    - 'tests/datasetJsonLd.test.ts (bun:test, readCatalog(''fixtures/published'')): unemployment_rate pl has url
      ''https://zohelo.com/indicators/unemployment_rate'', temporalCoverage ''2000/2025'', isBasedOn names [''Eurostat'',
      ''Bank Światowy – WDI''], license ''https://creativecommons.org/licenses/by/4.0/''; en url ''https://zohelo.com/en/indicators/unemployment_rate'';
      population has no license key (gus_terms differs); description starts with ''Stopa bezrobocia (BAEL): dane
      od 2000''.'
    acceptance:
    - datasetJsonLd is pure; JSON.stringify of its result round-trips; every rule above has a test
    verify:
    - run: bun run lint && bun test tests/datasetJsonLd.test.ts
      expect: exit 0; 0 fail
    out_of_scope:
    - pageMeta and the indicator route
    - distribution (CSV download) entries
    depends_on:
    - com/site/indicators/data/readers
    - com/site/site-v1/seo/meta
  - key: com/site/indicators/pages/kpi-sources
    type: Task
    title: List a KPI's sources with their licences for the source footer
    effort: S
    state: open
    contract: false
    context: 'Every indicator page shows its sources and licence under the numbers (Epic done_when). latestTile()
      (Task latest-tile) gives the value; this Task adds the pure functions that resolve a KPI''s source_keys in catalog/catalog.json
      (type Catalog in src/published.ts) into names and licences, and shape them for SourceFooter from @zohelo/design
      (props sources: { name; code?; url? }[], licence?: string).'
    files:
    - create: src/indicators/sources.ts
    - create: tests/kpiSources.test.ts
    steps:
    - 'Export type KpiSource = { source_key: string; name: string; register_id: string; licence: { name: string; url:
      string; attribution: string } | null } and function kpiSources(catalog: Catalog, kpiKey: string, locale: Locale):
      KpiSource[] (`import type` from ''../published''; Locale from ''../i18n''). Unknown kpiKey throws Error(`KPI ${kpiKey}
      is not in the catalog`).'
    - 'One entry per key of the KPI''s source_keys that has a catalog.sources entry, in source_keys order (others
      skipped): name = name_pl/name_en; licence = the catalog.licences entry with the source''s licence_key (attribution
      = attribution_text), null when missing.'
    - 'export function footerProps(sources: KpiSource[]): { sources: { name: string }[]; licence?: string }: sources
      mapped to { name }; licence = the distinct licence names in order joined by '' · ''; the licence key is left
      out when no source has a licence.'
    - 'tests/kpiSources.test.ts (bun:test, readCatalog(''fixtures/published'')): unemployment_rate in pl gives names
      [''Eurostat'', ''Bank Światowy – WDI''], both with licence name ''Creative Commons Attribution 4.0'', and footerProps
      licence ''Creative Commons Attribution 4.0'' (once); population in en gives [''Eurostat'', ''World Bank – WDI'',
      ''Statistics Poland – Local Data Bank''] and licence ''Creative Commons Attribution 4.0 · GUS terms of use (illustrative)'';
      an unknown source_key is skipped; with licences [] every licence is null and footerProps has no licence key;
      ''nope'' throws /not in the catalog/.'
    acceptance:
    - Both functions are pure and do not mutate the catalog
    - Every rule above is covered by a test
    verify:
    - run: bun run lint && bun test tests/kpiSources.test.ts
      expect: exit 0; 0 fail
    out_of_scope:
    - Rendering SourceFooter on a page; latestTile() and datasetJsonLd()
    - Dataset codes (not in catalog.json v1)
    depends_on:
    - com/site/indicators/data/readers
  - key: com/site/indicators/pages/index-route
    type: Task
    title: Add the /indicators index page grouped by domain
    effort: M
    state: open
    contract: false
    context: 'indicatorGroups() (src/indicators/groups.ts) groups catalog KPIs by domain and latestTile() (src/indicators/tile.ts)
      builds KpiTile props from kpi/<key>/latest.json; .published/ is filled by scripts/fetch-published.ts (fixtures
      without credentials). Target: /indicators and /en/indicators, pre-rendered, one section per domain with a
      KpiTile per KPI. Data comes from a route loader (build time only, ssr: false).'
    files:
    - create: src/routes/indicators.tsx
    - edit: src/routes.ts
    - edit: src/site.config.ts
    - create: tests/indicatorsRoute.test.ts
    steps:
    - 'site.config.ts pages: add { path: ''/indicators'', title: { pl: ''Wskaźniki'', en: ''Indicators'' }, description:
      { pl: ''Najważniejsze wskaźniki o Polsce z najnowszą wartością, źródłem i datą.'', en: ''Headline indicators on
      Poland with the latest value, source and date.'' } }.'
    - 'routes.ts pages(): add route(''indicators'', ''routes/indicators.tsx'', { id: `indicators${suffix}` }).'
    - 'routes/indicators.tsx: export async function loader({ request }) with locale = localeOf(new URL(request.url).pathname);
      catalog = readCatalog(publishedDir()); groups = indicatorGroups(catalog, locale); for every KPI in the groups
      tile = latestTile(kpi, readKpiLatest(dir, kpi_key), catalog.units, locale); return { groups: groups with each
      kpi''s tile }. A missing latest.json throws (the build must fail).'
    - 'Component: <main className="mx-auto max-w-5xl px-4 py-12">, <h1>, per group a <section> with <h2> and a grid
      (grid gap-4 sm:grid-cols-2 lg:grid-cols-3) of <KpiTile label value unit delta period locale href /> (@zohelo/design).'
    - 'tests/indicatorsRoute.test.ts (bun:test, PUBLISHED_DIR=fixtures/published): loader for http://x/indicators returns
      4 groups, first group key ''economy''; unemployment_rate tile value 3.2; loader for http://x/en/indicators gives
      English names; prerenderPaths() contains ''/indicators'' and ''/en/indicators''.'
    acceptance:
    - build/client/indicators/index.html links every published fixture KPI to /indicators/<kpi_key>
    verify:
    - run: bun install --frozen-lockfile && bun run lint && bun test tests/indicatorsRoute.test.ts
      expect: exit 0; 0 fail
    - run: bun run build && grep -o 'href="/indicators/[a-z_]*"' build/client/indicators/index.html | sort -u | wc -l
      expect: exit 0; count equals the published KPIs in fixtures/published/catalog/catalog.json
    out_of_scope:
    - The /indicators/:kpi page (Task kpi-route); home today strip
    - Header navigation links
    depends_on:
    - com/growth/what-changed/build-data/fetch-script
    - com/site/indicators/pages/groups
    - com/site/indicators/pages/latest-tile
  - key: com/site/indicators/pages/kpi-route
    type: Task
    title: Add the /indicators/:kpi page with value, regions and sources
    effort: L
    state: open
    contract: false
    context: 'Task index-route links every KPI to /indicators/<kpi_key>; the pure helpers exist: latestTile(), kpiSources()
      and footerProps() (src/indicators/sources.ts), datasetJsonLd() (src/seo.ts), rankRegions() (src/regions/ranking.ts).
      Target: one pre-rendered page per published KPI in PL and EN with KpiTile, a regional table when the KPI has
      voivodeship rows, SourceFooter and Dataset JSON-LD.'
    files:
    - create: src/routes/indicator.tsx
    - edit: src/routes.ts
    - edit: react-router.config.ts
    - create: tests/indicatorRoute.test.ts
    steps:
    - 'routes.ts pages(): add route(''indicators/:kpi'', ''routes/indicator.tsx'', { id: `indicator${suffix}` }).'
    - 'react-router.config.ts prerender(): return [...prerenderPaths(), ...paths] where paths = for each catalog KPI
      with status ''published'' (readCatalog(publishedDir())) `/indicators/${k}` and `/en/indicators/${k}`.'
    - 'routes/indicator.tsx loader({ request, params }): locale from the pathname; kpi = catalog KPI params.kpi, else
      throw new Response(''Not found'', { status: 404 }); latest = readKpiLatest; return { tile: latestTile(...), sources:
      footerProps(kpiSources(catalog, kpi, locale)), ranking: rankRegions(latest), geo: readGeo(dir, ''voivodeship'') when ranking
      is not null else null, jsonLd: datasetJsonLd(kpi, catalog, locale), name }.'
    - 'meta(): pageMeta({ path: `/indicators/${kpi}`, locale, title: name, description: `${name} — zohelo` }).'
    - 'Component: <main className="mx-auto max-w-4xl px-4 py-12">: <script type="application/ld+json"> with jsonLd
      (as routes/home.tsx), <h1> name, <KpiTile .../>, when ranking: <h2> Województwa/Voivodeships and <RankingTable
      ranking geo unit locale />, then <SourceFooter sources licence date={tile.checkedAt ?? tile.period} locale />.'
    - 'tests/indicatorRoute.test.ts (PUBLISHED_DIR=fixtures/published): unemployment_rate gives tile value 3.2 and
      a ranking; ''nope'' throws a 404 Response.'
    acceptance:
    - build/client/indicators/<kpi_key>/index.html exists for every published fixture KPI in PL and EN
    - Each page has one application/ld+json Dataset script and a source line
    verify:
    - run: bun install --frozen-lockfile && bun run lint && bun test tests/indicatorRoute.test.ts
      expect: exit 0; 0 fail
    - run: bun run build && grep -c '"@type":"Dataset"' build/client/en/indicators/unemployment_rate/index.html
      expect: exit 0; 1
    out_of_scope:
    - Line chart, definition, CSV link (todo); sitemap entries for KPI pages
    depends_on:
    - com/site/indicators/pages/index-route
    - com/site/indicators/pages/kpi-sources
    - com/site/indicators/pages/dataset-jsonld
    - com/site/regions/map/ranking-table
  - key: com/site/indicators/pages/value-unit
    type: Task
    title: Show each latest value in its own unit (latestTile)
    effort: S
    state: open
    contract: false
    context: 'zohelo-data now writes a unit_key on every latest.json value (docs/published.md, Bug zohelo-data#2148), because
