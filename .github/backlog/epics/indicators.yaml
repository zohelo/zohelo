key: com/site/indicators
area: com/site
title: Indicators (20 headline KPIs)
phase: 1
priority: P1
target: 2027-01-09
why: 'Indicator pages are the search engine of the site: one address per KPI ("stopa bezrobocia Polska") with the
  latest value, a chart, regions and sources. They replace the dummy metric cards and the Pulse ticker with real,
  cited numbers.'
outcome: /indicators lists 20 headline KPIs by domain and /indicators/<kpi_key> shows each with latest value, change,
  chart, regional breakdown where available, definition, sources, licence and download, in PL and EN, pre-rendered
  from the published layer.
in_scope:
- Build-time data from 06_published/v1 (catalog, kpi/<key>/latest.json and series.parquet)
- Index page, KPI page template, Dataset JSON-LD, today strip on home (6 KPI chips)
- Replacing MetricsSection and PulseSection with real KPIs (markets = NBP/ECB rates, decision 3)
out_of_scope:
- All catalogued KPIs (Phase 3 growth; the template handles them automatically)
- Interactive pivot (zohelo-bi)
done_when:
- 20 KPI pages × 2 languages pre-rendered; every number shows source, dataset code and date
- The home today strip shows CPI, unemployment, GDP growth, EUR/PLN, average wage, NBP reference rate with real
  values
- No Illustrative badge remains on the metrics or pulse sections
depends_on:
- data/published/published-v1
- data/metadata/catalogue-v1
- com/site/site-v1
- com/design/design-v1
decisions:
- 'owner 27 Oct no. 3: markets section uses public rates (NBP/ECB), no stock quotes'
- 'plan §3.5: zohelo.com never calls the lakehouse at runtime; it fetches published files at build'
deliverables:
- key: com/site/indicators/data
  title: Published data available at build
  done_when:
  - Build fails clearly when published files are missing; local dev works from a committed fixture
  todo:
  - scripts/fetch-published.ts (shared with com/growth/what-changed/build-data) writing .published/ for the build;
    ready once gold.publish writes 06_published/v1. The PR check keeps reading fixtures/published/ (no credentials).
  tasks:
  - key: com/site/indicators/data/readers
    type: Task
    title: Add published-layer fixtures and typed readers
    effort: M
    state: open
    contract: false
    context: 'The site reads 06_published/v1 files at build, never at runtime (contract: zohelo-data docs/published.md
      and warehouse/published/). Nothing is in R2 yet, so the site works from copies of the contract fixtures.
      Readers take the directory as an argument: the build later passes .published/, tests pass fixtures/published.'
    files:
    - create: fixtures/published/
    - create: src/published.ts
    - create: tests/published.test.ts
    steps:
    - 'Copy the five fixtures: `for p in catalog/catalog.json manifest.json kpi/unemployment_rate/latest.json
      feed/changes.json geo/voivodeship.geojson; do mkdir -p fixtures/published/$(dirname $p); gh api "repos/zohelo/zohelo-data/contents/warehouse/published/fixtures/$p?ref=47bb8da1997995cfedd4b69ac6b7ccafc8a468b7"
      -H "Accept: application/vnd.github.raw" > fixtures/published/$p; done`.'
    - 'src/published.ts: export types with every field of docs/published.md (optional fields with ?): Catalog
      (version: 1, generated_at, kpis: CatalogKpi[], domains: Domain[], units: Unit[], sources: Source[], licences:
      Licence[]), CatalogKpi (dimensions: KpiDimension[]), Domain {domain_key, level, parent_key: string | null,
      name_en, name_pl, csa_code, sort: number}, Unit {unit_key, symbol, name_en, name_pl, is_rate: boolean},
      KpiLatest, LatestValue, Changes, ChangeItem.'
    - 'Readers (node:fs readFileSync, node:path join): readCatalog(dir) → catalog/catalog.json, readKpiLatest(dir,
      kpiKey) → kpi/<kpiKey>/latest.json, readChanges(dir) → feed/changes.json.'
    - 'One private readJson(path): a missing file throws Error(`published file missing: ${path}`). Each reader then
      throws Error(`published file invalid: ${path}`) unless: catalog version === 1 and kpis is an array; latest
      kpi_key === kpiKey and values is an array; changes items is an array.'
    - 'tests/published.test.ts (bun:test, dir ''fixtures/published''): catalog has 5 kpis and unemployment_rate
      name_pl ''Stopa bezrobocia (BAEL)''; latest values[0].value is 3.2; changes has 2 items; readKpiLatest(dir,
      ''nope'') and readCatalog(''fixtures'') throw /published file missing/.'
    acceptance:
    - The five fixtures are identical to zohelo-data's at the pinned commit
    - Reader errors name the file path
    verify:
    - run: bun run lint && bun test tests/published.test.ts
      expect: exit 0; 0 fail
    - run: bun run build
      expect: exit 0
    out_of_scope:
    - scripts/fetch-published.ts and deploy.yml (todo above)
    - Readers for manifest.json, series.parquet and geo files
    depends_on:
    - data/published/published-v1/contract/schemas
- key: com/site/indicators/pages
  title: Index and KPI page template
  depends_on:
  - com/site/indicators/data
  done_when:
  - /indicators and /indicators/<kpi_key> pre-rendered for the 20 KPIs listed in site.config
  todo:
  - 'Route /indicators: grouped by domain (dim_domain from catalog), KpiTile per KPI.'
  - 'Route /indicators/:kpi: KpiTile, line Chart (series), regional DataTable when kpi_dimension has geography,
    definition, SourceFooter, licence, CSV download link to the published extract, Dataset JSON-LD; prerender list
    from site.config indicators.'
- key: com/site/indicators/home
  title: Today strip and real metrics on home
  depends_on:
  - com/site/indicators/pages
  done_when:
  - Home today strip and the metrics/pulse sections read published values; Illustrative badges removed there
  todo:
  - Replace MetricsSection with the today strip (6 KpiTiles); replace PulseSection with a rates block (NBP EUR/PLN,
    USD/PLN, CHF/PLN, reference rate) from published KPIs; delete src/content/pulseData.ts and metricsData.ts.
