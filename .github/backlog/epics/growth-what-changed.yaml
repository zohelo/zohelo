key: com/growth/what-changed
area: com/growth
title: What-changed feed and RSS
phase: 1
priority: P1
target: 2027-01-16
why: A site that looks the same every day gives no reason to return. The pipeline already knows when each dataset
  was refreshed; turning that into a daily "what changed" list gives fresh content every day with no editorial work.
outcome: zohelo.com shows "what changed" (latest dataset updates and the KPIs they moved) on the home page and at
  /changes, rebuilt after each pipeline publish, with an RSS feed.
in_scope:
- Reading feed/changes.json from the published layer at build
- Home block, /changes page (PL/EN), /rss.xml and /en/rss.xml
- Rebuild trigger after each publish
out_of_scope:
- E-mail delivery (newsletter Epic, Phase 2)
- Hand-written commentary
done_when:
- /changes lists the entries of the latest published feed/changes.json with dates and links to indicator pages
- rss.xml validates as RSS 2.0 and updates after each publish
depends_on:
- data/published/published-v1
- com/site/site-v1
deliverables:
- key: com/growth/what-changed/build-data
  title: Build-time fetch of the published layer
  done_when:
  - The deploy workflow downloads 06_published/v1 files needed by the site with the lakehouse read key before building
  todo:
  - Add scripts/fetch-published.ts (S3 GetObject with STORAGE_LAKEHOUSE_READ_ACCESS_KEY/SECRET_KEY, endpoint STORAGE_ENDPOINT_URL,
    bucket STORAGE_LAKEHOUSE_BUCKET_NAME) writing to .published/; deploy.yml passes those env names; the build fails
    if catalog.json is missing. Shared with the Indicators Epic — whichever starts first writes it.
- key: com/growth/what-changed/page
  title: Home block, /changes and RSS
  depends_on:
  - com/growth/what-changed/build-data
  done_when:
  - Home shows the 10 latest changes; /changes shows 30 days; rss.xml generated at build
  todo:
  - Route /changes reading .published/feed/changes.json and rendering ChangesList (Task changes-list); home block
    with the 10 latest changes.
  tasks:
  - key: com/growth/what-changed/page/rss-build
    type: Task
    title: Write rss.xml and en/rss.xml at build from the published feed
    effort: S
    state: open
    contract: false
    context: 'renderRss() (src/growth/rss.ts) turns feed items into RSS 2.0 and readChanges() (src/published.ts) reads
      feed/changes.json from a directory. Nothing calls them at build yet. The build will later get the published
      layer in .published/ (scripts/fetch-published.ts, not written yet); until then that directory does not exist
      and the build must still pass. This Task adds the build step, testable now with PUBLISHED_DIR=fixtures/published.'
    files:
    - create: scripts/rss.ts
    - edit: package.json
    - edit: .gitignore
    steps:
    - 'scripts/rss.ts (same style as scripts/sitemap.ts): dir = process.env.PUBLISHED_DIR ?? ''.published''; out =
      join(import.meta.dir, ''..'', ''build'', ''client''). When join(dir, ''feed'', ''changes.json'') does not exist,
      console.log(`rss: ${dir}/feed/changes.json missing, no feed written`) and return with exit code 0.'
    - 'Otherwise changes = readChanges(dir); builtAt = changes.generated_at (no clock); write out/rss.xml = renderRss(changes.items,
      ''pl'', builtAt) and out/en/rss.xml = renderRss(changes.items, ''en'', builtAt) (mkdirSync(join(out, ''en''),
      { recursive: true }) first); console.log(`rss: ${changes.items.length} items written to build/client/rss.xml
      and build/client/en/rss.xml`).'
    - 'package.json, script build: append '' && bun scripts/rss.ts'' after ''bun scripts/sitemap.ts''.'
    - '.gitignore: add the line ''.published/''.'
    acceptance:
    - bun run build passes without .published/ and prints the 'missing' line
    - With PUBLISHED_DIR=fixtures/published both feeds are written, well-formed, with 2 items each
    verify:
    - run: bun run build 2>&1 | grep '^rss:'
      expect: 'rss: .published/feed/changes.json missing, no feed written'
    - run: PUBLISHED_DIR=fixtures/published bun scripts/rss.ts && xmllint --noout build/client/rss.xml build/client/en/rss.xml
        && grep -o '<item>' build/client/en/rss.xml | wc -l
      expect: 'rss: 2 items written …; xmllint silent; 2'
    out_of_scope:
    - scripts/fetch-published.ts, deploy.yml and the /changes route
    - A <link rel="alternate"> to the feed in the page head
    depends_on:
    - com/growth/what-changed/page/rss-writer
    - com/site/indicators/data/readers
    - com/site/site-v1/seo/sitemap
  - key: com/growth/what-changed/page/changes-list
    type: Task
    title: Add the ChangesList component for the what-changed feed
    effort: M
    state: open
    contract: false
    context: 'The /changes page (30 days) and the home block (10 latest) both list items of feed/changes.json (types
      ChangeItem and Source in src/published.ts). This Task adds one component for both; routes come later. Styling
      uses the design token classes (text-text, text-text-muted, border-border, font-ui, font-mono) as in @zohelo/design
      components.'
    files:
    - create: src/growth/ChangesList.tsx
    - create: tests/changesList.test.tsx
    steps:
    - 'export function ChangesList({ items, sources, locale, limit }: { items: ChangeItem[]; sources: Source[]; locale:
      Locale; limit?: number }) (`import type` from ''../published'' — it imports node:fs; Locale and localizedPath
      from ''../i18n'').'
    - 'Order items by at descending (equal at keep input order, do not mutate items), then take the first limit (all
      when limit is undefined).'
    - 'Render <ol className="divide-y divide-border"> with one <li className="py-3"> per item: <time dateTime={at}
      className="font-ui text-[length:var(--z-size-xs)] text-text-muted">{at.slice(0, 10)}</time>; the title (title_pl
      / title_en) as <a href={localizedPath(`/indicators/${kpi_keys[0]}`, locale)}> when kpi_keys is non-empty, else
      a <span>; then <div className="font-mono text-[length:var(--z-size-xs)] text-text-muted">{`${name} · ${dataset_key}`}</div>
      (one template string), name = name_pl / name_en of the matching source, else source_key.'
    - 'No items: render <p className="text-text-muted"> ''Brak zmian w ostatnich 30 dniach.'' / ''No changes in the
      last 30 days.'' instead of the list.'
    - 'tests/changesList.test.tsx (bun:test, renderToStaticMarkup, readChanges and readCatalog of fixtures/published):
      pl markup contains ''Eurostat: zaktualizowano stopę bezrobocia (przykład)'', href="/indicators/unemployment_rate"
      and ''Narodowy Bank Polski · fx_a''; en contains href="/en/indicators/fx_rate"; limit 1 gives one <li; inline
      items with at 2026-01-02 and 2026-01-03 render the 01-03 one first; empty kpi_keys gives no <a; [] gives the
      Polish empty text.'
    acceptance:
    - Every rule above is covered by a test
    verify:
    - run: bun run lint && bun test tests/changesList.test.tsx
      expect: exit 0; 0 fail
    out_of_scope:
    - The /changes route, the home block and the 30-day filter (the feed holds 30 days)
    - FreshnessBadge or pagination
    depends_on:
    - com/site/indicators/data/readers
    - com/site/site-v1/i18n/routing
  - key: com/growth/what-changed/page/rss-writer
    type: Task
    title: Add a pure RSS 2.0 writer for the what-changed feed
    effort: S
    state: open
    contract: false
    context: 'The site will publish /rss.xml (Polish) and /en/rss.xml (English) from feed/changes.json of the
      published layer (zohelo-data docs/published.md). This Task adds only the pure function that turns feed
      items into RSS 2.0 XML; the build script and routes come later. Item input is a structural subset of
      changes.json items declared in the file itself, so it does not wait for src/published.ts.'
    files:
    - create: src/growth/rss.ts
    - create: tests/rss.test.ts
    steps:
    - 'Export type FeedItem = { at: string; source_key: string; dataset_key: string; kpi_keys: string[]; title_pl:
      string; title_en: string } and function renderRss(items: FeedItem[], locale: ''pl'' | ''en'', builtAt:
      string): string. Import site from ''../site.config''; base = site.url for pl, `${site.url}/en` for en.'
    - 'Escape every text and attribute value with a local escapeXml (& < > " '' to &amp; &lt; &gt; &quot; &apos;).
      Dates are new Date(x).toUTCString().'
    - 'Output, lines joined with ''\n'': `<?xml version="1.0" encoding="UTF-8"?>`, <rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">,
      <channel> with title (pl ''zohelo — co się zmieniło'', en ''zohelo — what changed''), link ${base}/changes,
      description site.description[locale], language pl or en, lastBuildDate from builtAt, <atom:link href="${base}/rss.xml"
      rel="self" type="application/rss+xml"/>, then the items, </channel></rss>.'
    - 'Items: sorted by at descending (equal at keep input order), at most 50. Each <item>: title = title_pl or
      title_en; link = ${base}/indicators/${kpi_keys[0]}, or ${base}/changes when kpi_keys is empty; <guid isPermaLink="false">${source_key}:${dataset_key}:${at}</guid>;
      pubDate from at.'
    - 'tests/rss.test.ts (bun:test, items from zohelo-data warehouse/published/fixtures/feed/changes.json written
      inline): pl output contains ''<link>https://zohelo.com/indicators/unemployment_rate</link>'' and the Polish
      title; en output links under https://zohelo.com/en/; a title ''A & B <C>'' is escaped; newer at comes first;
      60 items give 50 <item> elements; empty kpi_keys links to /changes.'
    acceptance:
    - renderRss is pure (no file, network or clock access) and returns well-formed RSS 2.0
    - Every rule above is covered by a test
    verify:
    - run: bun run lint && bun test tests/rss.test.ts
      expect: exit 0; 0 fail
    out_of_scope:
    - scripts/rss.ts, the /changes route and the home block (todo above)
    - Serving or linking the feed
    depends_on:
    - data/published/published-v1/contract/schemas
- key: com/growth/what-changed/trigger
  title: Rebuild after each publish
  repo: zohelo-data
  done_when:
  - After gold.publish succeeds, zohelo.com's deploy workflow runs on main
  todo:
  - 'zohelo-data publish step dispatches zohelo''s deploy.yml via the org bot token (actions: write on zohelo);
    debounce to at most one rebuild per hour.'
