key: com/growth/calendar-ics
area: com/growth
title: Release calendar feed (.ics)
phase: 1
priority: P2
target: 2027-01-23
why: A calendar entry in the reader's own calendar is the strongest external trigger to return on release day (inflation,
  unemployment, GDP flash). The platform will hold a release calendar table.
outcome: zohelo.com offers a subscribable calendar (webcal) of upcoming releases from GUS, Eurostat and NBP, generated
  from the published release calendar.
in_scope:
- /calendar.ics generated at build from feed/calendar.ics or the release_calendar extract
- Subscribe link on home and indicator pages
out_of_scope:
- The /calendar page with filters (Phase 2 Epic com/growth/calendar-page)
- Push notifications
done_when:
- https://zohelo.com/calendar.ics validates (RFC 5545) and contains next 60 days of releases
depends_on:
- data/published/published-v1
- com/growth/what-changed
deliverables:
- key: com/growth/calendar-ics/feed
  title: Calendar feed served
  done_when:
  - calendar.ics copied/generated into build/client at build; Content-Type text/calendar via public/_headers
  tasks:
  - key: com/growth/calendar-ics/feed/copy
    type: Task
    title: Copy calendar.ics into the build and serve it as text/calendar
    effort: S
    state: open
    contract: false
    context: 'The published layer has feed/calendar.ics, one VEVENT per release (zohelo-data docs/published.md). The
      build reads it from PUBLISHED_DIR (default .published/, missing until scripts/fetch-published.ts exists), like
      scripts/rss.ts (Task rss-build). Vite copies public/ into build/client; Cloudflare Pages reads its _headers.'
    files:
    - create: scripts/calendar.ts
    - create: public/_headers
    - edit: package.json
    steps:
    - 'scripts/calendar.ts (same style as scripts/rss.ts; node:fs existsSync, readFileSync, copyFileSync; node:path
      join): dir = process.env.PUBLISHED_DIR ?? ''.published''; src = join(dir, ''feed'', ''calendar.ics''); out = join(import.meta.dir,
      ''..'', ''build'', ''client'').'
    - 'When src does not exist: console.log(`calendar: ${dir}/feed/calendar.ics missing, no calendar written`) and
      process.exit(0).'
    - 'Otherwise text = readFileSync(src, ''utf8''); unless text.startsWith(''BEGIN:VCALENDAR'') throw new Error(`calendar:
      ${src} is not an iCalendar file`). copyFileSync(src, join(out, ''calendar.ics'')) (exact bytes, no rewrite); events
      = (text.match(/^BEGIN:VEVENT/gm) ?? []).length; console.log(`calendar: ${events} events written to build/client/calendar.ics`).'
    - 'public/_headers, exactly two lines: ''/calendar.ics'' and ''  Content-Type: text/calendar; charset=utf-8''
      (two leading spaces).'
    - 'package.json, script build: append '' && bun scripts/calendar.ts'' after ''bun scripts/rss.ts''.'
    acceptance:
    - The build passes without .published/; a calendar is copied byte-identical; a non-iCalendar file fails
    verify:
    - run: bun run build 2>&1 | grep '^calendar:' && cat build/client/_headers
      expect: 'calendar: .published/feed/calendar.ics missing, no calendar written; then the two _headers lines'
    - run: d=$(mktemp -d) && mkdir -p $d/feed && printf 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//zohelo//test//EN\r\nBEGIN:VEVENT\r\nUID:t1\r\nDTSTAMP:20261028T000000Z\r\nDTSTART:20261101T080000Z\r\nSUMMARY:Test\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n'
        > $d/feed/calendar.ics && PUBLISHED_DIR=$d bun scripts/calendar.ts && cmp $d/feed/calendar.ics build/client/calendar.ics
        && printf 'hello' > $d/feed/calendar.ics && PUBLISHED_DIR=$d bun scripts/calendar.ts; echo "exit $?"
      expect: 'calendar: 1 events written to build/client/calendar.ics; cmp silent; then an error naming .../feed/calendar.ics
        and a non-zero exit'
    out_of_scope:
    - scripts/fetch-published.ts and deploy.yml
    - Generating calendar.ics from rows; the subscribe links
    depends_on:
    - com/growth/what-changed/page/rss-build
- key: com/growth/calendar-ics/links
  title: Subscribe links
  depends_on:
  - com/growth/calendar-ics/feed
  done_when:
  - webcal://zohelo.com/calendar.ics link on home and each indicator page, PL/EN labels
  todo:
  - Place SubscribeCalendar (Task subscribe) in the home what-changed block and the indicator page sidebar once /calendar.ics
    is served.
  tasks:
  - key: com/growth/calendar-ics/links/subscribe
    type: Task
    title: Add the SubscribeCalendar link component
    effort: S
    state: open
    contract: false
    context: 'zohelo.com will serve /calendar.ics, the release calendar (Deliverable feed). Readers subscribe with a
      webcal:// link or download the file. This Task adds only the component with both links; it is placed on pages
      once the feed is served (todo above). site.url in src/site.config.ts is ''https://zohelo.com''.'
    files:
    - create: src/components/SubscribeCalendar.tsx
    - create: tests/subscribeCalendar.test.tsx
    steps:
    - 'export function calendarLinks(): { webcal: string; https: string } = { webcal: site.url.replace(/^https:/, ''webcal:'')
      + ''/calendar.ics'', https: site.url + ''/calendar.ics'' } (import site from ''../site.config'').'
    - 'export function SubscribeCalendar({ locale }: { locale: ''pl'' | ''en'' }) renders <p className="font-ui text-[length:var(--z-size-sm)]
      text-text-muted"> with <a href={webcal} className="text-text underline"> ''Subskrybuj kalendarz publikacji''
      (pl) / ''Subscribe to the release calendar'' (en), the text '' · '', and <a href={https} download className="underline">
      ''Pobierz plik .ics'' (pl) / ''Download the .ics file'' (en). No state or effects.'
    - 'tests/subscribeCalendar.test.tsx (bun:test, renderToStaticMarkup from react-dom/server): calendarLinks() equals
      { webcal: ''webcal://zohelo.com/calendar.ics'', https: ''https://zohelo.com/calendar.ics'' }; the pl markup contains
      both hrefs and ''Subskrybuj kalendarz publikacji''; the en markup contains ''Subscribe to the release calendar''
      and ''Download the .ics file''.'
    acceptance:
    - Every rule above is covered by a test
    verify:
    - run: bun run lint && bun test tests/subscribeCalendar.test.tsx
      expect: exit 0; 0 fail
    out_of_scope:
    - Serving /calendar.ics and public/_headers (Deliverable feed)
    - Placing the component on any page
